<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LibrarySE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <header class="site-header">
        <nav class="navbar">
            <div class="logo">Library<span class="logo-accent">SE</span></div>
            <ul class="nav-links">
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/books}">Books</a></li>
                <li><a th:href="@{/staff}">Staff</a></li>
            </ul>
            <div class="nav-actions">
                <a th:href="@{/login}" class="btn-ghost">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="login-form">
                <h2>Create Account</h2>
                
                <form th:action="@{/auth/signup}" th:object="${user}" method="post">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter your first name" required>
                        <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="alert alert-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter your last name" required>
                        <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="alert alert-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="Enter your email" required>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="alert alert-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="Enter your password" required>
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="alert alert-error"></div>
                        <p style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">Password must be at least 6 characters long.</p>
                    </div>
                    <div style="text-align: center; margin-top: 2rem;">
                        <button type="submit" class="btn">Create Account</button>
                    </div>
                </form>

                <div style="text-align: center; margin-top: 1rem;">
                    <p style="color: var(--text-muted);">Already have an account? <a th:href="@{/login}" style="color: var(--gold);">Sign In</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-copy">&copy; 2025 LibrarySE. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
